name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Migrations match the schema
        working-directory: apps/api
        run: npx drizzle-kit generate | tee /tmp/drizzle.txt && grep -q "No schema changes" /tmp/drizzle.txt
      - name: Test (unit, API, row-level security, tenant isolation)
        run: npm test
      - name: Build web app
        run: npm run build
        env:
          # The build needs to know where the API lives; any URL works for CI.
          BACKEND_URL: http://localhost:4000
